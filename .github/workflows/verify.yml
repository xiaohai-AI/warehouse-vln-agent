name: verify

# 只跑**离线**断言：不需要 ROS / Gazebo / GPU / 显示器。
# 判据在 tests/ 里是断言，"读日志对账"那套已经删掉了（它不会因为代码坏了而变红）。
#
# 不放进 CI 的：make world / robot（要 opencv 与 xacro，且会重写被跟踪的真值）、
# 以及一切需要 Gazebo 的判据。证据以产物形式提交，见 docs/LIMITATIONS.md。

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: 离线断言（无 ROS / 无 GPU）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.10（项目基线）
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 依赖
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install -r requirements-ci.txt

      - name: 确认没有把 ROS 当依赖
        run: |
          python3.10 -c "import numpy, yaml, langgraph, pydantic; print('deps OK')"
          python3.10 -c "import rclpy" 2>/dev/null && { echo 'rclpy 不该出现在这里'; exit 1; } || echo 'rclpy 未安装 ✓'

      - name: 单元测试（含反硬编码 / 真值隔离守护）
        run: python3.10 -m pytest tests -q

      - name: 指令基准（静默猜错必须为 0）
        run: python3.10 -m depot_vln.eval --backend rule --inventory sim --out results/bench.csv

      - name: 前向安全层自检
        run: python3.10 scripts/forward_guard.py --selftest

      - name: 上传结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          if-no-files-found: warn
          path: |
            results/bench.csv
            results/bench.json
