# depot-vln — 指令基准（人工编写，**不由被测解析器的模板生成**）
#
# 与重构前那份 69 条基准的根本差别：
#   旧：utterance 由模板拼出来，模板与 `nlu.py` 的正则一一对应，答案由同一份真值算出
#       -> 100% 是构造出来的恒等式，换一个说法就崩，测不出任何泛化能力。
#   新：句子是人写的（含口语、省略、英文、错地址、生造说法），期望行为是**声明**的；
#       `oracle.py` 用真值独立复核每一条声明（目标可达吗？那个 bay 真的空吗？），
#       声明与真值矛盾就**拒绝运行**，而不是静默计分。
#
# 四类：direct / attribute / ambiguous / unreachable
meta:
  schema: depot-vln/bench@2
  note: expected 由人声明，oracle 用 ground_truth 复核；解析器与生成器无关。

