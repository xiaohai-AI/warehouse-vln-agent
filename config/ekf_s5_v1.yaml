# S5：地面光流 + 轮速 + IMU 的 EKF 融合（robot_localization）-> odom->base_footprint
#
# 在 SLAM-1 里的角色：S4（纯地面光流）已把 ATE 从 S3 的 32 m 拉到 0.288 m，但离 SPEC 的
# 0.6×S1=0.214 m 还差 34%。分段还原率已经 98–102%（里程计本身没问题），所以这一档不再
# 改视觉，而是**用两种模态互补**：
#   * 轮速（mecanum_odom，~250 Hz）：短时最稳、抗遮挡，但打滑时无界漂移；
#   * 地面光流（10 Hz）：不打滑、对沿轴与侧移都准（实测 1.00±0.07），但地面被遮挡/反光时断流；
#   * IMU：只取偏航角速度做短时平滑，不用它的绝对偏航（仿真里会与视觉重复）。
# 这就是工业 AMR 的标准架构：轮速做主力、视觉做校正、IMU 做平滑。
#
# 关键约定
#   * 仿真 `odom_tf:=false`：mecanum_odom 不发 TF，EKF 独占 odom->base_footprint；
#   * `floorflow_odom --publish-tf 0`：它也不许发 TF（否则两个发布者打架）；
#   * two_d_mode=true：平面仓库，z/roll/pitch 锁死；
#   * 视觉这一路用 `odom1_relative: true`：它的原点是自己节点启动那一刻，
#     与轮速的出生点可能差几厘米 —— 用相对量起，避免两路绝对位姿互相拉扯。
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true      # 每次起 EKF 看一遍：哪一路真的被收下了

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # --- 轮速（主力）：位置 x,y,yaw + 速度 vx,vy,vyaw
    odom0: /odom
    odom0_config: [true, true, false,
                   false, false, true,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20

    # --- 地面光流（校正）：只要位置 x,y（yaw 由 IMU+轮速管，不重复喂）
    odom1: /odometry/floorflow
    odom1_config: [true, true, false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    # **relative 必须 false**：相对模式要查 odom->base_footprint 这个 TF，而它的唯一
    # 发布者就是 EKF 自己（floorflow 用 --publish-tf 0、仿真 odom_tf:=false）—— 自引用
    # 会算出发散/NaN。两路都发 odom 系下的绝对位姿，RL 本来就支持按协方差加权。
    odom1_relative: false
    odom1_queue_size: 10

    # --- IMU：只取偏航角速度（vyaw）
    # **必须用中继后的 /imu_tf**：桥出来的原始 /imu 的 header.frame_id 是 gz 作用域名
    # （depot_bot/imu_link → 全局 /depot_bot/imu_link），而 robot_state_publisher 发的是
    # imu_link，TF 查不到 EKF 会静默丢掉这一路（不报错，只是融合结果里没有 IMU）。
    imu0: /imu_tf
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    # 初始协方差：轮速给得比视觉"自信"一些（短时），但不要压死视觉，
    # 否则视觉的长时校正进不来（S4 的价值就在这里）。
    # 不设 initial_estimate_covariance（默认值就够；S2 那套也没设）。
    # 回看：第一版设了 15 元对角阵列，同时配 relative: true，两个"独有变量"一起引入，
    # 排障时要拆开验证 —— 以后一次只改一个。
